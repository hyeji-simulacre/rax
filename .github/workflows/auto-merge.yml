name: Auto-merge weekly update

# 주간 예약 작업이 만든 PR(claude/ 또는 update/ 로 시작하는 브랜치)을 검사한 뒤 자동으로 병합하고 사이트를 배포한다.
# 안전장치: 같은 저장소 브랜치 + 저장소 주인이 연 PR + data/ 폴더만 바뀜 + validate.py 통과일 때만 병합한다.
# 그 밖의 PR은 건드리지 않으므로 사람이 직접 검토·병합한다.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  auto-merge:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'claude/') || startsWith(github.head_ref, 'update/')) &&
      github.event.pull_request.user.login == github.repository_owner &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Only data/ files changed
        run: |
          git fetch -q origin main
          changed=$(git diff --name-only origin/main...HEAD)
          echo "$changed"
          if [ -z "$changed" ] || echo "$changed" | grep -qv '^data/'; then
            echo "data/ 밖의 파일이 바뀌었거나 변경이 없어 자동 병합하지 않습니다."
            exit 1
          fi

      - name: Validate data
        run: python3 scripts/validate.py

      - name: Merge and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" --merge --delete-branch
          # GITHUB_TOKEN으로 한 병합은 push 배포를 깨우지 않으므로 배포를 직접 실행한다
          gh workflow run pages.yml --ref main
