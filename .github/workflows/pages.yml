name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 22 * * 0"   # 매주 월요일 07:00(한국 시간)에 새 썸네일을 찍는다
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate case data
        run: python3 scripts/validate.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture source-page thumbnails
        continue-on-error: true
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2 sharp@0.33.5
          npx playwright install --with-deps chromium
          node scripts/capture-thumbs.mjs
      - name: Commit new thumbnails
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thumbs data/thumbs.json
          if ! git diff --cached --quiet; then
            git commit -m "썸네일 갱신 [skip ci]"
            git pull --rebase origin main && git push origin HEAD:main
          fi

      - name: Collect site files
        run: |
          mkdir -p _site
          cp -r index.html assets data .nojekyll _site/
          if [ -d thumbs ]; then cp -r thumbs _site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
